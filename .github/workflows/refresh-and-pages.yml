name: Refresh proxy data and deploy dashboard

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-and-pages.yml"
      - "config/**"
      - "src/**"
      - "site/index.html"
      - "tests/**"
      - "pyproject.toml"

concurrency:
  group: world-proxy-atlas-refresh-v3
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("site/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, flags=re.I | re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected exactly one inline script, found {len(scripts)}")
          Path("/tmp/atlas-dashboard.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/atlas-dashboard.js

      - name: Collect and validate
        env:
          ATLAS_MAX_CANDIDATES: "1500"
          ATLAS_CONCURRENCY: "150"
        run: python -m atlas.pipeline

      - name: Production snapshot checks
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          with open("data/proxies.json", encoding="utf-8") as stream:
              payload = json.load(stream)
          with open("data/stats.json", encoding="utf-8") as stream:
              stats = json.load(stream)
          with open("data/sources.json", encoding="utf-8") as stream:
              source_payload = json.load(stream)

          proxies = payload.get("proxies", [])
          assert payload.get("count") == len(proxies), "Proxy count does not match payload"
          assert stats.get("total_verified") == len(proxies), "Stats count does not match payload"
          assert stats.get("generated_at") == payload.get("generated_at"), "Snapshot timestamps differ"
          assert stats.get("generated_at") == source_payload.get("generated_at"), "Source diagnostics timestamp differs"
          assert len({proxy.get("proxy") for proxy in proxies}) == len(proxies), "Duplicate public proxy entries"
          assert sum(stats["by_protocol"].values()) == len(proxies), "Protocol counts do not sum to total"
          assert stats["validation_attempted"] == stats["selected_candidates"], "Selected/tested totals differ"
          assert stats["validation_passed"] + stats["validation_failed"] == stats["validation_attempted"], "Validation totals do not balance"
          assert sum(stats["validation_failure_reasons"].values()) == stats["validation_failed"], "Failure categories do not balance"
          assert sum(stats["publication_hold_reasons"].values()) == stats["validation_passed"] - stats["total_verified"], "Publication hold reasons do not balance"
          assert stats["feeds_configured"] == stats["feed_count"] + stats["feeds_fetch_failed"], "Feed fetch totals do not balance"
          assert stats["discovered_candidates"] >= stats["selected_candidates"], "Selected candidates exceed discovered pool"

          for proxy in proxies:
              assert proxy.get("status") == "verified", "Non-verified proxy in public output"
              assert proxy.get("success_streak", 0) >= 2, "Proxy lacks repeat validation"
              assert proxy.get("latency_ms", 999999) <= 1200, "Slow proxy in public output"
              assert proxy.get("quality_score", 0) >= 60, "Low-quality proxy in public output"
              assert proxy.get("last_checked_at") == stats["generated_at"], "Stale proxy in public output"
              assert proxy.get("proxy") == f'{proxy["protocol"]}://{proxy["address"]}', "Proxy URL does not match metadata"
              if proxy["quality_tier"] == "strong":
                  assert proxy["success_streak"] >= 3, "Strong proxy lacks three successful checks"
                  assert proxy["latency_ms"] <= 900, "Strong proxy exceeds latency limit"
                  assert proxy["quality_score"] >= 75, "Strong proxy fails score threshold"

          base = Path("site/files")
          expected_all = [proxy["proxy"] for proxy in proxies]
          assert (base / "all.txt").read_text(encoding="utf-8").splitlines() == expected_all, "all.txt differs from JSON snapshot"
          assert json.loads((base / "proxies.json").read_text(encoding="utf-8")) == payload, "Download JSON differs from snapshot"
          assert json.loads(Path("site/data/proxies.json").read_text(encoding="utf-8")) == payload, "Dashboard JSON differs from snapshot"
          assert json.loads(Path("site/data/stats.json").read_text(encoding="utf-8")) == stats, "Dashboard stats differ from snapshot"
          for protocol in ("http", "https", "socks4", "socks5"):
              expected = [proxy["address"] for proxy in proxies if proxy["protocol"] == protocol]
              assert (base / f"{protocol}.txt").read_text(encoding="utf-8").splitlines() == expected, f"{protocol}.txt differs from snapshot"
          expected_strong = [proxy["proxy"] for proxy in proxies if proxy["quality_tier"] == "strong"]
          assert (base / "strong.txt").read_text(encoding="utf-8").splitlines() == expected_strong, "strong.txt differs from snapshot"
          expected_connect = [proxy["address"] for proxy in proxies if proxy["protocol"] == "http"]
          assert (base / "http-connect.txt").read_text(encoding="utf-8").splitlines() == expected_connect, "HTTP CONNECT list differs from tested HTTP proxies"
          with (base / "proxies.csv").open(encoding="utf-8", newline="") as stream:
              assert len(list(csv.DictReader(stream))) == len(proxies), "CSV export row count differs from snapshot"

          sources = source_payload.get("sources", [])
          assert len(sources) == stats["feeds_configured"], "Source diagnostics count mismatch"
          assert sum(1 for source in sources if source["status"] == "ok") == stats["feed_count"], "Healthy feed diagnostics mismatch"
          assert sum(int(source.get("unique_candidates", 0)) for source in sources) == stats["source_unique_candidates"], "Per-feed candidate counts mismatch"
          print(
              f'Production snapshot checks passed: {len(proxies)} qualified '
              f'({stats["strong_count"]} strong); {stats["validation_attempted"]} tested, '
              f'{stats["validation_passed"]} passed; {len(sources)} feeds inspected'
          )
          PY

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            # Overlay this run's generated snapshot on the newest main tree.
            # A soft reset avoids add/add conflicts when another run published first.
            git reset --mixed origin/main
            git add proxies data site/data site/files
            if git diff --cached --quiet; then
              echo "Generated snapshot is already current."
              exit 0
            fi
            git commit -m "chore(data): refresh verified proxy snapshot"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update (attempt $attempt/3); retrying."
            sleep 2
          done
          echo "::error::Could not publish generated data after three attempts."
          exit 1

      - name: Verify GitHub Pages is enabled for Actions publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "::error title=One-time GitHub Pages setup required::Open Settings > Pages > Build and deployment, select GitHub Actions as the Source, and save. Then re-run this workflow."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
